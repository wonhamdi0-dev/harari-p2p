         <!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harari P2P</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-main: #12151c;
      --card-bg: #1e222d;
      --accent-green: #00c076;
      --accent-red: #ff4d4d;
      --text-main: #ffffff;
      --text-sub: #848e9c;
      --border-color: #2b313a;
      --badge-bg: #2b313a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 70px;
    }

    .top-header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .top-header h2 { font-size: 18px; }
    .top-header p { font-size: 11px; color: var(--text-sub); }

    .trade-type-toggle {
      display: flex;
      padding: 12px 16px;
      gap: 10px;
    }
    .type-btn {
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      border: none;
      cursor: pointer;
      background: transparent;
      color: var(--text-sub);
    }
    .type-btn.active-buy { background-color: var(--accent-green); color: #fff; }
    .type-btn.active-sell { background-color: var(--accent-red); color: #fff; }

    .ads-container { padding: 0 16px; }

    .ad-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }

    .user-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .user-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #f0b90b;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    .username { font-size: 14px; font-weight: bold; }
    .user-stats { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

    .action-btn {
      padding: 6px 16px;
      border-radius: 6px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }

    .buy-btn { background-color: var(--accent-green); color: #fff; }
    .sell-btn { background-color: var(--accent-red); color: #fff; }

    .ad-details {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
    }

    .detail-col { display: flex; flex-direction: column; }
    .label { font-size: 11px; color: var(--text-sub); }
    .price { font-size: 18px; font-weight: bold; color: var(--text-main); margin-top: 2px; }
    .limit-val { font-size: 12px; margin-top: 2px; }

    .payment-tags { display: flex; gap: 6px; margin-top: 10px; }
    .badge {
      background-color: var(--badge-bg);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      color: var(--text-sub);
      border-left: 3px solid #f0b90b;
    }

    /* Modal / Pop-up Window */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      border-top: 1px solid var(--border-color);
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 20px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: #fff;
      font-size: 14px;
    }

    .submit-order-btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: var(--accent-green);
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-color);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: var(--text-sub);
      cursor: pointer;
    }
    .nav-item.active { color: #f0b90b; }
    .nav-icon { font-size: 18px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="top-header">
    <div>
      <h2>Harari P2P</h2>
      <p>Trade USDT with local currency</p>
    </div>
  </div>

  <div class="trade-type-toggle">
    <button id="buyToggle" class="type-btn active-buy" onclick="switchMode('buy')">Buy</button>
    <button id="sellToggle" class="type-btn" onclick="switchMode('sell')">Sell</button>
  </div>

  <div class="ads-container" id="adsList">
    <!-- Ad Card 1 -->
    <div class="ad-card">
      <div class="user-info">
        <div class="user-left">
          <div class="avatar">T</div>
          <div>
            <div class="username">Teke_94 🥉</div>
            <div class="user-stats">★ 94.5% | 644 orders</div>
          </div>
        </div>
        <button class="action-btn buy-btn" onclick="openOrderModal('Teke_94', 194.00, 'Buy')">Buy</button>
      </div>

      <div class="ad-details">
        <div class="detail-col">
          <span class="label">PRICE</span>
          <span class="price">194.00 <small style="font-size: 11px;">ETB</small></span>
        </div>
        <div class="detail-col" style="text-align: right;">
          <span class="label">LIMIT</span>
          <span class="limit-val">580.00 - 1,486.04 ETB</span>
        </div>
      </div>

      <div class="payment-tags">
        <span class="badge">Telebirr</span>
        <span class="badge">CBE Birr</span>
      </div>
    </div>

    <!-- Ad Card 2 -->
    <div class="ad-card">
      <div class="user-info">
        <div class="user-left">
          <div class="avatar" style="background:#00c076; color:#fff;">A</div>
          <div>
            <div class="username">AA_HH ⚙️️</div>
            <div class="user-stats">★ 100% | 178 orders</div>
          </div>
        </div>
        <button class="action-btn buy-btn" onclick="openOrderModal('AA_HH', 194.35, 'Buy')">Buy</button>
      </div>

      <div class="ad-details">
        <div class="detail-col">
          <span class="label">PRICE</span>
          <span class="price">194.35 <small style="font-size: 11px;">ETB</small></span>
        </div>
        <div class="detail-col" style="text-align: right;">
          <span class="label">LIMIT</span>
          <span class="limit-val">200.00 - 1,821.05 ETB</span>
        </div>
      </div>

      <div class="payment-tags">
        <span class="badge">Telebirr</span>
      </div>
    </div>
  </div>

  <!-- Modal / Order Pop-up -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Buy USDT</h3>
        <button class="close-btn" onclick="closeOrderModal()">✕</button>
      </div>

      <div class="form-group">
        <label>Merchant (ነጋዴ):</label>
        <input type="text" id="merchantName" readonly>
      </div>

      <div class="form-group">
        <label>የ USDT መጠን (USDT Amount):</label>
        <input type="number" id="usdtInput" placeholder="ለምሳሌ: 50" oninput="calculateTotal()">
      </div>

      <div class="form-group">
        <label>አጠቃላይ በብር (Total ETB):</label>
        <input type="text" id="etbTotal" readonly placeholder="0.00 ETB">
      </div>

      <div class="form-group">
        <label>የክፍያ መንገድ (Payment Method):</label>
        <select id="payMethod">
          <option value="Telebirr">Telebirr</option>
          <option value="CBE Birr">CBE Birr</option>
          <option value="Bank of Abyssinia">Bank of Abyssinia</option>
        </select>
      </div>

      <button class="submit-order-btn" id="confirmBtn" onclick="confirmTrade()">Confirm Order</button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active"><div class="nav-icon">🏠</div><span>Home</span></div>
    <div class="nav-item"><div class="nav-icon">📄</div><span>Orders</span></div>
    <div class="nav-item"><div class="nav-icon">📢</div><span>Ads</span></div>
    <div class="nav-item"><div class="nav-icon">👛</div><span>Wallet</span></div>
    <div class="nav-item"><div class="nav-icon">•••</div><span>More</span></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentPrice = 0;
    let currentTradeType = 'Buy';

    function switchMode(mode) {
      const buyBtn = document.getElementById('buyToggle');
      const sellBtn = document.getElementById('sellToggle');
      
      if(mode === 'buy') {
        buyBtn.className = 'type-btn active-buy';
        sellBtn.className = 'type-btn';
      } else {
        sellBtn.className = 'type-btn active-sell';
        buyBtn.className = 'type-btn';
      }
    }

    function openOrderModal(merchant, price, type) {
      currentPrice = price;
      currentTradeType = type;
      
      document.getElementById('modalTitle').innerText = `${type} USDT - ${merchant}`;
      document.getElementById('merchantName').value = merchant;
      document.getElementById('usdtInput').value = '';
      document.getElementById('etbTotal').value = '0.00 ETB';
      
      const confirmBtn = document.getElementById('confirmBtn');
      if (type === 'Buy') {
        confirmBtn.style.background = 'var(--accent-green)';
        confirmBtn.style.color = '#000';
      } else {
        confirmBtn.style.background = 'var(--accent-red)';
        confirmBtn.style.color = '#fff';
      }

      document.getElementById('orderModal').style.display = 'flex';
    }

    function closeOrderModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    function calculateTotal() {
      const usdt = parseFloat(document.getElementById('usdtInput').value) || 0;
      const total = usdt * currentPrice;
      document.getElementById('etbTotal').value = total.toFixed(2) + ' ETB';
    }

    function confirmTrade() {
      const usdt = document.getElementById('usdtInput').value;
      const etb = document.getElementById('etbTotal').value;
      const method = document.getElementById('payMethod').value;
      const merchant = document.getElementById('merchantName').value;

      if (!usdt || usdt <= 0) {
        alert('እባክዎን ትክክለኛ የ USDT መጠን ያስገቡ!');
        return;
      }

      tg.sendData(JSON.stringify({
        type: currentTradeType,
        merchant: merchant,
        usdtAmount: usdt,
        etbAmount: etb,
        paymentMethod: method
      }));

      closeOrderModal();
    }
  </script>
</body>
</html>
