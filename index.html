<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harari P2P Exchange</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-green: #00e676;
      --accent-red: #ff5252;
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h2 {
      margin: 0;
      color: var(--accent-green);
    }
    .rates-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      border: 1px solid #333;
    }
    .rate-box {
      text-align: center;
    }
    .rate-title {
      font-size: 12px;
      color: var(--text-sub);
    }
    .rate-val {
      font-size: 18px;
      font-weight: bold;
      margin-top: 4px;
    }
    .buy-val { color: var(--accent-green); }
    .sell-val { color: var(--accent-red); }

    .tab-container {
      display: flex;
      background: var(--card-bg);
      border-radius: 8px;
      margin-bottom: 16px;
      padding: 4px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab.active-buy {
      background: var(--accent-green);
      color: #000;
    }
    .tab.active-sell {
      background: var(--accent-red);
      color: #fff;
    }

    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: var(--card-bg);
      color: #fff;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: var(--accent-green);
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Harari P2P</h2>
    <p style="font-size: 12px; color: var(--text-sub);">Crypto & Fiat Exchange</p>
  </div>

  <div class="rates-card">
    <div class="rate-box">
      <div class="rate-title">እንገዛለን (Buy Rate)</div>
      <div class="rate-val buy-val">152.00 ETB</div>
    </div>
    <div class="rate-box">
      <div class="rate-title">እንሸጣለን (Sell Rate)</div>
      <div class="rate-val sell-val">155.00 ETB</div>
    </div>
  </div>

  <div class="tab-container">
    <div id="buyTab" class="tab active-buy" onclick="switchTab('buy')">መግዛት (Buy)</div>
    <div id="sellTab" class="tab" onclick="switchTab('sell')">መሸጥ (Sell)</div>
  </div>

  <form id="p2pForm">
    <div class="form-group">
      <label id="amountLabel">የ USDT መጠን masukkan:</label>
      <input type="number" id="usdtAmount" placeholder="ለምሳሌ: 100" required oninput="calculateTotal()">
    </div>

    <div class="form-group">
      <label>አጠቃላይ በብር (ETB):</label>
      <input type="text" id="etbAmount" readonly placeholder="0.00 ETB">
    </div>

    <div class="form-group">
      <label>የክፍያ መንገድ (Payment Method):</label>
      <select id="paymentMethod">
        <option value="Telebirr">Telebirr</option>
        <option value="CBE">CBE (ንግድ ባንክ)</option>
        <option value="Bank of Abyssinia">Bank of Abyssinia</option>
      </select>
    </div>

    <button type="button" id="submitBtn" onclick="submitOrder()">ትዕዛዝ ላክ (Submit Order)</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentMode = 'buy';
    const buyRate = 155.00; // ተጠቃሚው ሲገዛ የሚሰላበት ተመን
    const sellRate = 152.00; // ተጠቃሚው ሲሸጥ የሚሰላበት ተመን

    function switchTab(mode) {
      currentMode = mode;
      const buyTab = document.getElementById('buyTab');
      const sellTab = document.getElementById('sellTab');
      const submitBtn = document.getElementById('submitBtn');

      if (mode === 'buy') {
        buyTab.className = 'tab active-buy';
        sellTab.className = 'tab';
        submitBtn.style.background = 'var(--accent-green)';
        submitBtn.style.color = '#000';
      } else {
        sellTab.className = 'tab active-sell';
        buyTab.className = 'tab';
        submitBtn.style.background = 'var(--accent-red)';
        submitBtn.style.color = '#fff';
      }
      calculateTotal();
    }

    function calculateTotal() {
      const usdt = parseFloat(document.getElementById('usdtAmount').value) || 0;
      const rate = currentMode === 'buy' ? buyRate : sellRate;
      const total = usdt * rate;
      document.getElementById('etbAmount').value = total.toFixed(2) + ' ETB';
    }

    function submitOrder() {
      const usdt = document.getElementById('usdtAmount').value;
      const etb = document.getElementById('etbAmount').value;
      const method = document.getElementById('paymentMethod').value;

      if (!usdt || usdt <= 0) {
        alert('እባክዎን ትክክለኛ የ USDT መጠን ያስገቡ!');
        return;
      }

      const orderData = {
        type: currentMode.toUpperCase(),
        usdtAmount: usdt,
        etbAmount: etb,
        paymentMethod: method
      };

      tg.sendData(JSON.stringify(orderData));
      tg.close();
    }
  </script>
</body>
</html>
